<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores an SVG favicon entirely and puts a screenshot of the page
         on the home screen instead, which for a felt is a beige square. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The three hands the whole game is written in. In the stylesheet these
         were an `@import`, which the preload scanner cannot see: the browser
         had to fetch and parse index.css before it learned there were fonts to
         go and get, which is a whole extra round trip spent staring at a blank
         page on a phone. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Caveat:wght@400;500;700&display=swap"
    />
    <!-- `viewport-fit=cover` puts the felt under the notch and the home bar
         rather than inside a pair of letterboxes; everything the player has to
         reach is held off those edges with the safe-area insets in index.css.
         Zoom is deliberately left alone — a table you cannot pinch into is a
         table somebody cannot read. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e3" />
    <!-- Installed to the home screen it is a game, not a browser tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Let It Ride</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
