# Let It Ride — a single container. Stateless out of the box; add the two
# blocks marked "accounts" below if you want people's records kept.
#
#   docker compose up -d
#
# Replace <owner> with your GitHub username/org, or pin a tag such as
# `:v1.0.0` or `:sha-abc1234` instead of `:latest`.

services:
  let-it-ride:
    image: ghcr.io/<owner>/let-it-ride:latest
    container_name: let-it-ride
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      PORT: 8080
      # The JVM sizes its heap from the container limit below, not the host.
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0

      # ── accounts (optional) ────────────────────────────────────────────
      # Uncomment all of this together. Either half alone does nothing: an
      # account with nowhere to write is not an account, and a database with
      # no way to prove who you are has nothing to put in it. The server says
      # so in its log and stays off rather than half-working, and everybody
      # plays as a guest exactly as before.
      #
      # LETITRIDE_DB: /data/letitride.db
      # LETITRIDE_OIDC_ISSUER: https://id.example.com
      # LETITRIDE_OIDC_CLIENT_ID: let-it-ride
      # LETITRIDE_OIDC_CLIENT_SECRET: the-secret-from-your-provider
      # # What the sign-in button says.
      # LETITRIDE_OIDC_NAME: PocketID
      # # Any passphrase. Without one a random key is used and everybody is
      # # signed out the next time this container restarts.
      # LETITRIDE_SESSION_SECRET: something-long-and-yours
      # # Only needed if your proxy does not set X-Forwarded-Proto/Host. This
      # # must match the callback URL registered at the provider exactly, and
      # # a mismatch is the one failure here with no useful error at either end.
      # LETITRIDE_OIDC_REDIRECT_URI: https://cards.example.com/api/auth/callback

    # Rooms are held in memory and vanish with the container. Without the
    # accounts block above that is the whole storage story, and the filesystem
    # can stay read-only.
    #
    # The volume below is the exception, and read_only stays on either way: a
    # read-only root filesystem does not make a mounted volume read-only, so
    # SQLite gets somewhere to keep its database and its write-ahead log and
    # nothing else on the box is writable.
    read_only: true
    # A named volume rather than a bind mount, because the server does not run
    # as root: Docker gives a fresh named volume the ownership of the image's
    # own /data, which is already the right user. `./data:/data` works too but
    # you have to chown it yourself first, and the symptom if you forget is a
    # line in the log and a game that plays on without accounts.
    # volumes:
    #   - letitride-data:/data
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 512M

    # The image ships its own healthcheck (GET /api/health), so `docker compose
    # ps` reports healthy once the server is actually accepting games.

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# Uncomment along with the volume above. One SQLite file; backing it up is
# `docker compose stop && cp` and nothing more.
# volumes:
#   letitride-data:

# ─────────────────────────────────────────────────────────────
# Building from this checkout instead of pulling a published image:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# ...or just swap the `image:` line above for:
#
#     build:
#       context: .
#       dockerfile: Dockerfile
#
# ─────────────────────────────────────────────────────────────
# Behind a reverse proxy, the WebSocket at /ws must be allowed to upgrade —
# that is the one thing that will silently break the game if it is missed.
#
# Traefik (add to the service):
#     labels:
#       - "traefik.enable=true"
#       - "traefik.http.routers.letitride.rule=Host(`cards.example.com`)"
#       - "traefik.http.services.letitride.loadbalancer.server.port=8080"
#
# Caddy:
#     cards.example.com {
#         reverse_proxy let-it-ride:8080
#     }
#
# nginx:
#     location / {
#         proxy_pass         http://127.0.0.1:8080;
#         proxy_http_version 1.1;
#         proxy_set_header   Upgrade    $http_upgrade;
#         proxy_set_header   Connection "upgrade";
#         proxy_set_header   Host       $host;
#         proxy_read_timeout 3600s;   # idle lobbies must outlive the default 60s
#     }
