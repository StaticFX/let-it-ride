name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Kept in step with the Dockerfile so CI runs what we run locally.
  BUN_VERSION: '1.3.6'
  # Shared by `preview` and `publish` so both describe the image the same way:
  # one builds it, the other names it, and a label that disagreed between them
  # would mean the tag you pull is not quite the image that was tested.
  IMAGE_TAGS: |
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=semver,pattern={{major}}
    type=ref,event=branch
    type=sha,format=short
    type=raw,value=latest,enable={{is_default_branch}}
  IMAGE_LABELS: |
    org.opencontainers.image.title=Let It Ride
    org.opencontainers.image.description=Flip 7-style card game — Kotlin backend serving its own frontend

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test the game engine
        run: ./gradlew :backend:test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the jar the suite runs against
        # Built here rather than by the suite's own bootstrap, so a build
        # failure is reported as a build failure.
        run: ./gradlew :backend:buildFrontend :backend:buildFatJar

      - name: Install the suite
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Cache the browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/bun.lock') }}

      - name: Install the browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: e2e
        # The jar is already built; the bootstrap only has to serve it.
        env:
          E2E_SKIP_BUILD: '1'
        run: bun run test

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  preview:
    name: Preview image (unverified)
    # The image is by far the slowest thing here — a multi-arch build with
    # arm64 under emulation — and waiting for the suites to finish before
    # starting it meant paying for the tests and the build end to end. It runs
    # alongside them instead, under a tag that says plainly it has not been
    # tested. `publish` then only has to point the release tags at it.
    #
    # Same gate as `publish`: a multi-arch image for every feature-branch push
    # is a lot of build minutes for a tag nobody pulls.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the unverified tag
        id: name
        # GHCR only takes a lowercase path, and `github.repository` keeps
        # whatever case the repository was named with.
        run: |
          image=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          {
            echo "image=${image}"
            echo "tag=${image}:unverified-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Work out the labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          labels: ${{ env.IMAGE_LABELS }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for most homelab boxes, arm64 for a Pi or an Apple-silicon host.
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the unverified tag. The release tags are `publish`'s to hand
          # out, once something has actually passed.
          tags: ${{ steps.name.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Skips the SLSA attestation pass, which also keeps the published
          # manifest to the two real platforms instead of adding unknown/unknown.
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Built, not yet verified"
            echo
            echo '```'
            echo "${{ steps.name.outputs.tag }}"
            echo '```'
            echo
            echo "The suites are still running. This tag is here to pull and poke at;"
            echo "it gets the release tags only once they are green."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish image
    # Only an image that passed every suite gets the release tags. Nothing is
    # rebuilt here — `preview` already pushed this exact digest, so this is a
    # manifest write rather than another twenty minutes of emulated arm64.
    #
    # The gate lives on `preview`; a branch that builds no image skips this
    # with it.
    needs: [backend, frontend, e2e, preview]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          labels: ${{ env.IMAGE_LABELS }}

      - name: Point the release tags at the image that passed
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ needs.preview.outputs.image }}@${{ needs.preview.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          if [ ${#args[@]} -eq 0 ]; then
            echo "no tags to publish — the metadata step produced nothing" >&2
            exit 1
          fi
          # Copies the manifest list as it stands, so every tag resolves to the
          # same two platform images the suites ran against.
          docker buildx imagetools create "${args[@]}" "$SOURCE"

      - name: Smoke test the published image
        # By digest, so this is exactly the artifact that was just tagged.
        env:
          SOURCE: ${{ needs.preview.outputs.image }}@${{ needs.preview.outputs.digest }}
        run: |
          docker run -d --name letitride -p 8080:8080 "$SOURCE"
          for i in $(seq 1 30); do
            if health=$(curl -fsS http://localhost:8080/api/health); then
              echo "$health"
              curl -fsS -o /dev/null -w 'frontend: %{http_code}\n' http://localhost:8080/
              # The end-to-end suite runs its server with the seed hook on. A
              # published image that shipped with it would let anyone deal
              # themselves a deck they already know — and would answer the
              # testing panel, which can write a hand onto any seat.
              case "$health" in
                *'"testHooks":false'*) echo "test hooks: off" ;;
                *) echo "the published image has its test hooks ON"; docker rm -f letitride; exit 1 ;;
              esac
              # The catalog is what the client gates the panel on, so it has to
              # say the same thing.
              catalog=$(curl -fsS http://localhost:8080/api/catalog)
              case "$catalog" in
                *'"testHooks":true'*) echo "the catalog offers the testing panel"; docker rm -f letitride; exit 1 ;;
                *) echo "catalog: no panel" ;;
              esac
              docker rm -f letitride
              exit 0
            fi
            sleep 2
          done
          echo "the published image never became healthy"
          docker logs letitride
          exit 1

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Deploy with:"
            echo '```sh'
            echo "docker run -d --restart unless-stopped -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
