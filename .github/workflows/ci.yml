name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Kept in step with the Dockerfile so CI runs what we run locally.
  BUN_VERSION: '1.3.6'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test the game engine
        run: ./gradlew :backend:test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  publish:
    name: Publish image
    # Only images that passed both suites are ever pushed — and only for the
    # default branch, a release tag, or a manual run. Publishing a multi-arch
    # image for every feature-branch push is a lot of build minutes for a tag
    # nobody pulls.
    needs: [backend, frontend]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Let It Ride
            org.opencontainers.image.description=Flip 7-style card game — Kotlin backend serving its own frontend

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for most homelab boxes, arm64 for a Pi or an Apple-silicon host.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Skips the SLSA attestation pass, which also keeps the published
          # manifest to the two real platforms instead of adding unknown/unknown.
          provenance: false

      - name: Smoke test the published image
        # By digest, so this is exactly the artifact that was just pushed.
        run: |
          docker run -d --name letitride -p 8080:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              curl -fsS -o /dev/null -w 'frontend: %{http_code}\n' http://localhost:8080/
              docker rm -f letitride
              exit 0
            fi
            sleep 2
          done
          echo "the published image never became healthy"
          docker logs letitride
          exit 1

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Deploy with:"
            echo '```sh'
            echo "docker run -d --restart unless-stopped -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
